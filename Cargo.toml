[package]
name = "choose-browser"
version = "0.1.0"
edition = "2021"
description = "A browser chooser for Linux and Windows - pick which browser opens your links"
license = "MIT"
repository = "https://github.com/tarcisiomiranda/choose-browser"
homepage = "https://github.com/tarcisiomiranda/choose-browser"
readme = "README.md"

[dependencies]
iced = { version = "0.13", features = ["image", "tokio"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"
image = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Environment", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
