name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_PYTHON_COMPILE: "false"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install_args: ${{ runner.os == 'Windows' && 'rust python' || 'rust python shellcheck' }}
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test release publisher
        run: mise run release:check

      - name: Run tests
        run: mise run test

      - name: Check formatting
        run: mise run fmt:check

      - name: Lint shell scripts
        run: mise run lint:shell

      - name: Test installer
        run: mise run test:installer
