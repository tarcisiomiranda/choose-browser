name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to publish, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  MISE_PYTHON_COMPILE: "false"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install_args: ${{ runner.os == 'Windows' && 'rust python' || 'rust python shellcheck' }}
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test release publisher
        run: mise run release:check

      - name: Validate release tag
        shell: bash
        run: mise exec -- python .github/scripts/release.py --validate-tag "$RELEASE_TAG"

      - name: Run tests
        run: mise run test

      - name: Lint shell scripts
        run: mise run lint:shell

      - name: Test installer
        run: mise run test:installer

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: choose-browser-linux-amd64
            binary: choose-browser
          - runner: ubuntu-24.04-arm
            asset: choose-browser-linux-arm64
            binary: choose-browser
          - runner: windows-latest
            asset: choose-browser-windows-amd64.exe
            binary: choose-browser.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          install_args: rust
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.asset }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          mkdir -p dist
          mise exec -- cargo build --release --locked
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Python
        uses: jdx/mise-action@v4
        with:
          install_args: python
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: choose-browser-*
          merge-multiple: true
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum choose-browser-* > checksums.txt

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: mise exec -- python .github/scripts/release.py

      - name: Write summary
        run: |
          {
            echo "## Release ${RELEASE_TAG}"
            echo
            echo "Published binaries:"
            for file in release/choose-browser-*; do
              echo "- $(basename "$file")"
            done
            echo "- checksums.txt"
          } >> "$GITHUB_STEP_SUMMARY"
